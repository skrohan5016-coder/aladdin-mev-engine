name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: F0 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Repository policy
        run: python scripts/check_repo_policy.py
      - name: Architecture identity
        run: python scripts/verify_architecture_lock.py
      - name: Ensure validation is non-mutating
        run: git diff --exit-code
