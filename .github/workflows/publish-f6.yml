name: Publish exact F6 non-workflow source

on:
  push:
    branches:
      - agent/f6-publication-helper

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests
      PYTHONDONTWRITEBYTECODE: "1"
