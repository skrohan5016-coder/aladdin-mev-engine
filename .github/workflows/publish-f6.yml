name: Publish exact F6 non-workflow source

on:
  push:
    branches:
      - agent/f6-publication-helper

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout immutable publication chunks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/f6-publication-helper
          path: helper
          persist-credentials: false
      - name: Checkout exact accepted F5 landing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f068d1f1ffad9d4c2439dd6f0fa36e333d73817f
          path: source
          fetch-depth: 0
          persist-credentials: true
      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Reconstruct and authenticate F6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/f6-chunks.sha256 <<'F6_CHUNK_HASHES'
          70e0a57199502712e2270f72929f9ee721e59acd25b6266997a7c7f3c1a175e1  helper/.f6-publication/chunk-00.b64
          5bc7a3f34a4b3bf7362c5d4d832ad2c91c9357117feec2a65b4c6a00131b40d9  helper/.f6-publication/chunk-01.b64
          5ae427412c609090f921e685c519c72c42d91df94454740bee42278a821abeaa  helper/.f6-publication/chunk-02.b64
          f42c0e7b8804e7b7d8b11ecc540e81e543d2cbd7f9f52fa99e069b50842dac55  helper/.f6-publication/chunk-03.b64
          9bb92baadf945892e6861ce1d5c2f7b99b91094d3a449d1c22e8232045dd019f  helper/.f6-publication/chunk-04.b64
          53cf6db0101c66211060224852947e857d14eb23acb361ba7624a6707fc0584c  helper/.f6-publication/chunk-05.b64
          7b8a561911a4998b1d5516dcaba31530715e08f6d507477787c1a82fe90fe537  helper/.f6-publication/chunk-06.b64
          d06b2555d154db81573847f99eae95437a983388659842f7fc59cc3871ee770d  helper/.f6-publication/chunk-07.b64
          05a5d39b341663aab96a01e38ff6d485ef426c38e073119afe06eee8f7eed2b7  helper/.f6-publication/chunk-08.b64
          dbfe0e8c970043d33608f3dc702024c18a41aac53338e5d001074987ff60d1f3  helper/.f6-publication/chunk-09.b64
          F6_CHUNK_HASHES
          sha256sum --check /tmp/f6-chunks.sha256
          cat helper/.f6-publication/chunk-*.b64 > /tmp/f6.patch.gz.b64
          test "$(wc -c < /tmp/f6.patch.gz.b64 | tr -d ' ')" = "56474"
          test "$(sha256sum /tmp/f6.patch.gz.b64 | cut -d' ' -f1)" = "dbdb9473584991ead7deeb74a6c3b7fc28cb982b99d61cf1b2d1e2b53c060094"
          base64 --decode /tmp/f6.patch.gz.b64 > /tmp/f6.patch.gz
          test "$(sha256sum /tmp/f6.patch.gz | cut -d' ' -f1)" = "ff8b06e7a3579ed9ba485b16d9dd500cc10eea6ca910368597f0dcd456607df4"
          gzip --decompress --stdout /tmp/f6.patch.gz > /tmp/f6.patch
          test "$(sha256sum /tmp/f6.patch | cut -d' ' -f1)" = "986eeadcc2278cb9fe4f85db5a403b5df64396b1c0e61bb0823c1a470248716a"
          ! grep -q '^diff --git a/.github/workflows/ci.yml' /tmp/f6.patch
          cd source
          test "$(git rev-parse HEAD)" = "f068d1f1ffad9d4c2439dd6f0fa36e333d73817f"
          test "$(git rev-parse 'HEAD^{tree}')" = "89df1b1bf5d665c1ea1b2abb80320d824b6e7bb4"
          git apply --check /tmp/f6.patch
          git apply /tmp/f6.patch
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "45"
          git diff --check
      - name: Validate focused F6 authority
        working-directory: source
        run: |
          python -m compileall -q src tests scripts
          python -m unittest -v test_secp256k1_f6 test_signed_transaction_f6 test_relay_evidence_f6 test_f6_schema_contracts test_governance_f6
          python scripts/verify_architecture_lock.py
          python scripts/verify_source_contracts.py
          python scripts/verify_f2_schemas.py
          python scripts/verify_f3_schemas.py
          python scripts/verify_f4_schemas.py
          python scripts/verify_f5_schemas.py
          python scripts/verify_f6_schemas.py
          git diff --check
      - name: Publish normal F6 feature branch commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git switch -c agent/f6-signed-relay-evidence-v1
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "45"
          test "$(git write-tree)" = "4e20f56bed008c5499652b23d06770fb4ed83b50"
          git config user.name "ROHAN"
          git config user.email "skrohan5016@gmail.com"
          git commit -m "F6 external signature and relay evidence foundation"
          git push origin HEAD:refs/heads/agent/f6-signed-relay-evidence-v1
