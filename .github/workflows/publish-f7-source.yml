name: Export validated exact F7 source artifact

on:
  push:
    branches:
      - agent/f7-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact publication material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: material
          persist-credentials: false
      - name: Checkout exact accepted F6 parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6481e17b2345c54261865125b61523610b7f87af
          path: work
          persist-credentials: false
      - name: Reconstruct exact validated F7 source
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "6481e17b2345c54261865125b61523610b7f87af"
          test "$(git -C work rev-parse 'HEAD^{tree}')" = "1115dccd7952225dfa1d58238aa550bf9e0aa995"
          cat material/.staging/f7-gz-part-00.bin material/.staging/f7-gz-part-01.bin material/.staging/f7-gz-part-02.bin material/.staging/f7-gz-part-03.bin material/.staging/f7-gz-part-04.bin material/.staging/f7-gz-part-05.bin material/.staging/f7-gz-part-06.bin material/.staging/f7-gz-part-07.bin > /tmp/f7.patch.gz
          echo "336db6c3b4a4c4e7b86c656b9aa240888288fd46f8837c014154184bb7792ca9  /tmp/f7.patch.gz" | sha256sum -c -
          gzip -dc /tmp/f7.patch.gz > /tmp/f7.patch
          echo "49c454979b5e6caa5135aaa54189d0117a4d9eab3d24a9c32d54ccfcc12f9f6e  /tmp/f7.patch" | sha256sum -c -
          git -C work apply --index --whitespace=error /tmp/f7.patch
          test "$(git -C work diff --cached --name-only | wc -l | tr -d ' ')" = "49"
          test "$(git -C work write-tree)" = "fd4dd9ccbf724f7e795bdfe6674b04502c19bb0b"
          tar --exclude=.git -C work -czf /tmp/aladdin-mev-engine-f7-validated-source.tar.gz .
      - name: Upload exact validated F7 source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aladdin-mev-engine-f7-validated-source
          path: /tmp/aladdin-mev-engine-f7-validated-source.tar.gz
          if-no-files-found: error
          retention-days: 1
