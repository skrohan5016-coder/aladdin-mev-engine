name: Export exact accepted F6 source for F7

on:
  push:
    branches:
      - agent/f7-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact accepted F6 landing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6481e17b2345c54261865125b61523610b7f87af
          persist-credentials: false
      - name: Verify exact accepted source identity
        run: |
          test "$(git rev-parse HEAD)" = "6481e17b2345c54261865125b61523610b7f87af"
          test "$(git rev-parse 'HEAD^{tree}')" = "1115dccd7952225dfa1d58238aa550bf9e0aa995"
      - name: Package exact accepted F6 source
        run: tar --exclude=.git -czf /tmp/aladdin-mev-engine-f6-accepted-source.tar.gz .
      - name: Upload exact accepted source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aladdin-mev-engine-f6-accepted-source
          path: /tmp/aladdin-mev-engine-f6-accepted-source.tar.gz
          if-no-files-found: error
          retention-days: 1
