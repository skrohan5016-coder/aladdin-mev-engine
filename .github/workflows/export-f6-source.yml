name: Export exact accepted F5 source

on:
  push:
    branches:
      - agent/f6-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact accepted F5 landing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f068d1f1ffad9d4c2439dd6f0fa36e333d73817f
          persist-credentials: false
      - name: Package repository source
        run: tar --exclude=.git -czf /tmp/aladdin-mev-engine-f5-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aladdin-mev-engine-f5-source
          path: /tmp/aladdin-mev-engine-f5-source.tar.gz
          if-no-files-found: error
          retention-days: 1
