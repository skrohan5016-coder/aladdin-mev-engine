name: Export exact F8 source for final remediation

on:
  push:
    branches:
      - agent/f8-remediation-export

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact F8 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a9e6141c2460dc25beac8f8b4c96a49d2de61309
          persist-credentials: false
      - name: Verify exact F8 identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a9e6141c2460dc25beac8f8b4c96a49d2de61309"
          test "$(git rev-parse 'HEAD^{tree}')" = "04c819f76d9ac2205afe53a06e9c6d7a3060a5cb"
      - name: Package exact source
        run: tar --exclude=.git -czf /tmp/aladdin-mev-engine-f8-remediation-source.tar.gz .
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aladdin-mev-engine-f8-remediation-source
          path: /tmp/aladdin-mev-engine-f8-remediation-source.tar.gz
          if-no-files-found: error
          retention-days: 1
