name: Export exact accepted F8 source for F9

on:
  push:
    branches:
      - agent/f9-source-export

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact accepted F8 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 851ab055979c79beea899c25fab43994213a4436
          persist-credentials: false
      - name: Verify accepted F8 identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "851ab055979c79beea899c25fab43994213a4436"
          test "$(git rev-parse 'HEAD^{tree}')" = "66aeada2769e9b2fccb943ec3c8150b974bb0400"
      - name: Package exact source
        run: tar --exclude=.git -czf /tmp/aladdin-mev-engine-f9-base.tar.gz .
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aladdin-mev-engine-f9-base
          path: /tmp/aladdin-mev-engine-f9-base.tar.gz
          if-no-files-found: error
          retention-days: 1
