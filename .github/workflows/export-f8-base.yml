name: Export exact accepted F7 source for F8

on:
  push:
    branches:
      - agent/f8-source-export

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact accepted F7 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ec4d9a211c204e3363e8a77d8de4ab2199a89be0
          persist-credentials: false
      - name: Verify accepted F7 identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ec4d9a211c204e3363e8a77d8de4ab2199a89be0"
          test "$(git rev-parse 'HEAD^{tree}')" = "42592ed5ce7dc8d87755ff95af4824dc20c9e6fa"
      - name: Package exact source
        run: tar --exclude=.git -czf /tmp/aladdin-mev-engine-f8-base.tar.gz .
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aladdin-mev-engine-f8-base
          path: /tmp/aladdin-mev-engine-f8-base.tar.gz
          if-no-files-found: error
          retention-days: 1
