name: Export exact F5 parent source

on:
  push:
    branches:
      - agent/f5-source-snapshot-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact merged F4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create exact source archive outside worktree
        run: tar --exclude=.git --exclude=.github/workflows/export-f5-source.yml -czf ../aladdin-mev-engine-f4-parent.tar.gz .
      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aladdin-mev-engine-f4-parent
          path: ../aladdin-mev-engine-f4-parent.tar.gz
          if-no-files-found: error
          retention-days: 1
