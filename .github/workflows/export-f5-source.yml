name: Export exact F5 source

on:
  push:
    branches:
      - agent/f5-source-snapshot-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact F5 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a527bd6b328e25e3314f5c012a89b9627b058c13
          persist-credentials: false
      - name: Create exact source archive
        run: tar --exclude=.git --exclude=f5-source.tar.gz -czf f5-source.tar.gz .
      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aladdin-mev-engine-f5-source
          path: f5-source.tar.gz
          if-no-files-found: error
          retention-days: 1
