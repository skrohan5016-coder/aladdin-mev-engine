name: Validate exact current F5 synthetic merge

on:
  push:
    branches:
      - agent/f5-publication-helper

permissions:
  contents: read

jobs:
  validate:
    name: F5 exact current synthetic merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact current merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 34c932aae54a4d5efe629351615390ed048d4e4a
          persist-credentials: false
      - name: Verify exact current merge identity
        run: test "$(git rev-parse HEAD)" = "34c932aae54a4d5efe629351615390ed048d4e4a"
      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Repository policy
        run: python scripts/check_repo_policy.py
      - name: Architecture identity
        run: python scripts/verify_architecture_lock.py
      - name: Source contracts identity
        run: python scripts/verify_source_contracts.py
      - name: F2 schemas identity
        run: python scripts/verify_f2_schemas.py
      - name: F3 schemas identity
        run: python scripts/verify_f3_schemas.py
      - name: F4 schemas identity
        run: python scripts/verify_f4_schemas.py
      - name: F5 schemas identity
        run: python scripts/verify_f5_schemas.py
      - name: Ensure validation is non-mutating
        run: git diff --exit-code
